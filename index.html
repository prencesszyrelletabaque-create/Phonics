<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teddy Bear Phonics - Units 1-3 Review</title>
<style>
:root{--ink:#4a2c14;--red:#e8281e;--cream:#fff7e6;--leaf:#4f9a3c;--honey:#f5a623}
*{box-sizing:border-box;margin:0}
body{font-family:"Comic Sans MS","Chalkboard SE","Baloo 2",system-ui,sans-serif;color:var(--ink);background:#2a1a0c;overflow-x:hidden}
.scr{display:none;min-height:100vh;padding:14px;background:center/cover fixed;position:relative}
.scr.on{display:block}
.scr::before{content:"";position:absolute;inset:0;background:rgba(255,247,230,.25)}
.scr>*{position:relative}
#home{background-image:url(bg/forest.jpg);text-align:center}
#fish{background-image:linear-gradient(#bfe9ff,#2b9bd6 70%,#12557e)}
#words{background-image:url(bg/cottage.jpg)}
#songs{background-image:url(bg/cottage-bear.jpg)}
#trace{background-image:url(bg/house.jpg)}
h1{font-size:clamp(28px,6vw,54px);background:var(--cream);display:inline-block;padding:10px 26px;border-radius:30px;border:5px solid var(--ink);margin:18px 0 6px}
.sub{display:inline-block;background:var(--honey);padding:6px 18px;border-radius:20px;font-weight:bold;margin-bottom:22px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,230px));gap:16px;justify-content:center;max-width:980px;margin:0 auto}
.big{font:inherit;font-size:22px;font-weight:bold;color:var(--ink);background:var(--cream);border:5px solid var(--ink);border-radius:26px;padding:20px 12px;cursor:pointer;box-shadow:0 7px 0 var(--ink)}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.big span{display:block;font-size:46px}
.den{max-width:900px;margin:22px auto 0;background:rgba(255,247,230,.92);border:5px solid var(--ink);border-radius:26px;padding:10px 16px}
.den div{font-size:34px;min-height:44px;word-break:break-all}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.back{font:inherit;font-weight:bold;background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:8px 16px;cursor:pointer}
.say{background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:8px 16px;font-weight:bold;flex:1;min-width:200px;font-size:20px}
.say.q{font-size:30px;color:var(--red);cursor:pointer}
.bc{font-size:24px;background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:4px 14px;font-weight:bold}
.sea{position:relative;height:min(72vh,640px);overflow:hidden;border-radius:26px;border:5px solid var(--ink)}
.f{position:absolute;width:150px;cursor:pointer;animation:sw linear infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.f svg{width:100%;display:block}
.f.pop{animation-play-state:paused;transform:scale(1.35)}
@keyframes sw{from{left:-190px}to{left:100%}}
.fl{font-family:inherit;font-weight:900;font-size:40px;fill:#e8281e;stroke:#4a2c14;stroke-width:3;paint-order:stroke}
.card{position:fixed;inset:0;background:rgba(40,20,5,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.card.on{display:flex}
.cb{background:var(--cream);border:6px solid var(--ink);border-radius:32px;padding:16px 22px;max-width:900px;width:100%;max-height:96vh;overflow:auto;text-align:center}
.lt{font-size:clamp(70px,15vw,140px);font-weight:900;line-height:1.05;color:var(--red)}
.lt b{display:inline-block;margin:0 .12em;transition:transform .2s,text-shadow .2s}
.lt b.hi{transform:scale(1.3);text-shadow:0 0 22px var(--honey),0 0 40px var(--honey)}
.lab{font-size:22px;font-weight:bold}
.pics{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pic{background:#fff;border:5px solid transparent;border-radius:22px;padding:6px;cursor:pointer;width:min(300px,42vw);transition:transform .2s}
.pic img{width:100%;display:block;border-radius:14px}
.cap{font-size:30px;font-weight:bold}.cap i{font-style:normal;color:var(--red);font-size:36px}
.pic.hi{border-color:var(--honey);box-shadow:0 0 28px var(--honey);transform:scale(1.05)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-weight:bold;font-size:18px;background:var(--leaf);color:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 18px;cursor:pointer}
.btn.o{background:var(--honey);color:var(--ink)}.btn.g{background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;max-width:900px;margin:12px auto}
.lb{font:inherit;font-size:52px;font-weight:900;color:var(--red);background:var(--cream);border:5px solid var(--ink);border-radius:24px;padding:10px;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.lb.sel{background:var(--honey)}
video{width:100%;max-height:60vh;background:#000;border-radius:18px;border:5px solid var(--ink)}
.panel{max-width:900px;margin:0 auto;background:rgba(255,247,230,.92);border:5px solid var(--ink);border-radius:26px;padding:14px;text-align:center}
canvas{background:#fff;border:5px solid var(--ink);border-radius:22px;touch-action:none;max-width:100%;cursor:crosshair;margin-top:8px}
.tip{background:var(--honey);border-radius:16px;padding:6px 14px;font-weight:bold;display:inline-block;margin:6px}
#rw{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,247,230,.9);z-index:40;text-align:center}
#rw.on{display:flex}
#rw .bear{font-size:min(40vw,230px);animation:bo .7s ease-in-out infinite alternate}
#rw h2{font-size:clamp(30px,7vw,56px);color:var(--red)}
@keyframes bo{from{transform:translateY(0) rotate(-8deg) scale(1)}to{transform:translateY(-30px) rotate(8deg) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.f{animation-duration:60s!important}#rw .bear{animation:none}}
#match{background-image:url(bg/forest.jpg)}
.be{font-size:min(34vw,150px);line-height:1.1}
.q{font-size:26px;font-weight:bold;margin:6px 0}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.opt{font:inherit;font-size:min(22vw,90px);background:var(--cream);border:5px solid var(--ink);border-radius:26px;padding:8px 20px;cursor:pointer;box-shadow:0 6px 0 var(--ink);min-width:110px}
.opt.sel{background:var(--honey)}.opt.done{background:#bdeaa8;opacity:.55;pointer-events:none}
.opt.bad{animation:sh .35s}
.cols{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.cols>div{display:flex;flex-direction:column;gap:12px}
.rev img{max-width:min(380px,80%);border-radius:18px;border:5px solid var(--ink);background:#fff}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>

<section id="home" class="scr on">
  <h1>Teddy Bear Phonics</h1><br>
  <div class="sub">Units 1-3 Review: Aa to Ii</div>
  <div class="menu">
    <button class="big" data-go="fish"><span>🐠</span>Fish Game</button>
    <button class="big" data-go="words"><span>🧸</span>Letters &amp; Pictures</button>
    <button class="big" data-go="match"><span>🧩</span>Match Game</button>
    <button class="big" data-go="songs"><span>🎵</span>Phonics Songs</button>
    <button class="big" data-go="trace"><span>✏️</span>Tracing</button>
  </div>
  <div class="den"><b>My Bear Den: <span class="bcn">0</span> bears</b><div id="den">Win bears to fill your den!</div></div>
</section>

<section id="fish" class="scr">
  <div class="top"><button class="back" data-go="home">🏠 Home</button>
    <div class="say" id="fsay">Tap a fish to learn, or play Find the letter!</div>
    <button class="btn o" id="find">🎯 Find the letter</button>
    <div class="bc">🧸 <span class="bcn">0</span></div></div>
  <div class="sea" id="sea"></div>
</section>

<section id="words" class="scr">
  <div class="top"><button class="back" data-go="home">🏠 Home</button><div class="say">Pick a letter to learn it!</div></div>
  <div class="grid" id="wgrid"></div>
</section>

<section id="songs" class="scr">
  <div class="top"><button class="back" data-go="home">🏠 Home</button><div class="say">Pick a letter song!</div></div>
  <div class="grid" id="sgrid"></div>
  <div class="panel" id="vwrap" style="display:none"><video id="vid" controls playsinline></video></div>
</section>

<section id="trace" class="scr">
  <div class="top"><button class="back" data-go="home">🏠 Home</button><div class="say">Trace Big and small letters with your finger or mouse.</div><div class="bc">🧸 <span class="bcn">0</span></div></div>
  <div class="panel">
    <div class="grid" id="tgrid" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr))"></div>
    <div class="row"><button class="btn o" id="tclear">🧹 Clear</button><button class="btn" id="tsay">🔊 Hear it</button><button class="btn g" id="tdone">✅ I'm done!</button></div>
    <div class="row"><span class="tip" id="ttip"></span></div>
    <canvas id="cv" width="860" height="420"></canvas>
  </div>
</section>

<section id="match" class="scr">
  <div class="top"><button class="back" data-go="home">🏠 Home</button><div class="say" id="msay">Choose a game!</div><div class="bc">🧸 <span class="bcn">0</span></div></div>
  <div class="row" style="margin-bottom:10px"><button class="btn" data-m="1">🔤 First letter</button><button class="btn o" data-m="2">👂 Listen &amp; find</button><button class="btn g" data-m="3">🔗 Match pairs</button></div>
  <div class="panel" id="mg"></div>
</section>

<div class="card" id="card"><div class="cb">
  <div class="lab" id="lab"></div>
  <div class="lt" id="lt"></div>
  <div class="pics" id="pics"></div>
  <div class="row">
    <button class="btn" id="again">🔊 Again</button>
    <button class="btn o" id="snd">🔊 Sound</button>
    <button class="btn g" id="stopb">⏹ Stop</button>
    <button class="btn g" id="close">✖ Close</button>
  </div>
</div></div>

<div id="rw"><div class="bear">🧸</div><h2 id="rwt">Great job!</h2></div>

<script src="timings.js"></script>
<script>
const L=[
 {c:"A",n:"ay",w:[["apple","apple"],["Annie","annie"]]},
 {c:"B",n:"bee",w:[["boy","boy"],["bat","bat"]]},
 {c:"C",n:"see",w:[["cat","cat"],["car","car"]]},
 {c:"D",n:"dee",w:[["dog","dog"],["duck","duck"]]},
 {c:"E",n:"ee",w:[["egg","egg"],["elephant","elephant"]]},
 {c:"F",n:"eff",w:[["fish","fish"],["farm","farm"]]},
 {c:"G",n:"jee",w:[["girl","girl"],["guitar","guitar"]]},
 {c:"H",n:"aitch",w:[["hat","hat"],["horse","horse"]]},
 {c:"I",n:"eye",w:[["insect","insect"],["ill","ill"]]}
];
const COL=["#ff7a59","#4fb3ff","#ffc233","#7bd34f","#b57bff","#ff6fa8","#2fd0c0","#ff9a3c","#6c8cff"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const lo=x=>x.c.toLowerCase();
let cur=null,token=0,target=null,ca=null;

/* ---------- bears (rewards) ---------- */
let bears=0;
try{bears=+localStorage.getItem("tbp-bears")||0}catch(e){}
function showBears(){
  $$(".bcn").forEach(e=>e.textContent=bears);
  const sets=["🧸","🐻","🧸","🧸","🐻‍❄️"];
  $("#den").textContent=bears?Array.from({length:Math.min(bears,40)},(_,i)=>sets[i%sets.length]).join(" "):"Win bears to fill your den!";
}
async function reward(msg){
  bears++;try{localStorage.setItem("tbp-bears",bears)}catch(e){}
  showBears();$("#rwt").textContent=msg||"Great job! You won a bear!";
  $("#rw").classList.add("on");
  await say("Great job!");
  setTimeout(()=>$("#rw").classList.remove("on"),700);
  await new Promise(r=>setTimeout(r,800));
}
$("#rw").onclick=()=>$("#rw").classList.remove("on");

/* ---------- British woman voice + trimmed clips ---------- */
let voice=null;
function pick(){
  const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
  for(const p of [/google uk english female/i,/hazel/i,/libby/i,/sonia/i,/serena/i,/kate/i,/martha/i,/fiona/i,/female/i]){
    const m=v.find(x=>p.test(x.name));if(m){voice=m;return}}
  voice=v[0]||null;
}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function say(t,gap){
  return new Promise(r=>{
    const fallback=()=>{
      if(!("speechSynthesis" in window)){setTimeout(r,800);return}
      const u=new SpeechSynthesisUtterance(t);
      u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;u.pitch=1.1;
      u.onend=()=>setTimeout(r,gap||150);u.onerror=()=>r();
      speechSynthesis.speak(u);
    };
    /* pre-generated British woman voice (say/*.mp3), falls back to browser voice */
    const a=new Audio(`say/${slug(t)}.mp3`);ca=a;
    let failed=false;
    a.onerror=()=>{if(!failed){failed=true;fallback()}};
    a.onended=()=>setTimeout(r,gap||150);
    a.play().catch(()=>{if(!failed){failed=true;fallback()}});
  });
}
const TR={A:["A",0],B:["B",0],C:["C",0],D:["D",0],E:["E",0],F:["F",0],G:["G",0],H:["HI",0,36.6],I:["HI",38.9]};
function track(letter){
  return new Promise(r=>{
    const[f,st,en]=TR[letter];
    const a=new Audio(`audio/full/${f}.mp3`);ca=a;
    a.onloadedmetadata=()=>{a.currentTime=st};
    a.ontimeupdate=()=>{if(en&&a.currentTime>=en){a.pause();r()}};
    a.onended=()=>r();a.onerror=()=>r();a.onpause=()=>{if(!a.ended&&!en)r()};
    a.play().catch(()=>r());
  });
}
const hasT=l=>!!(window.TIMINGS&&TIMINGS[l]);
let tms=[];
function clip(letter,part,gap){
  return new Promise(r=>{
    const a=new Audio(`audio/clips/${letter}-${part}.mp3`);ca=a;
    a.onended=()=>setTimeout(r,gap||200);a.onerror=()=>r();a.play().catch(()=>r());
  });
}
function block(letter,onEv){
  return new Promise(r=>{
    const a=new Audio(`audio/clips/${letter}-block.mp3`);ca=a;
    a.onplay=()=>{TIMINGS[letter].ev.forEach(([k,s,e])=>{
      tms.push(setTimeout(()=>onEv(k,true),s*1000));tms.push(setTimeout(()=>onEv(k,false),e*1000+120))})};
    a.onended=()=>setTimeout(r,300);a.onerror=()=>r();a.play().catch(()=>r());
  });
}
function stop(){token++;tms.forEach(clearTimeout);tms=[];if("speechSynthesis" in window)speechSynthesis.cancel();if(ca)ca.pause()}

/* ---------- navigation ---------- */
function go(id){stop();if(id==="match")setTimeout(()=>round(mm),0);target=null;$$(".scr").forEach(s=>s.classList.toggle("on",s.id===id));$("#card").classList.remove("on");$("#vid").pause();window.scrollTo(0,0)}
$$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---------- lesson: Big A small a / sound / Aa apple / Aa Annie ---------- */
async function lesson(i){
  stop();const my=token;cur=L[i];const x=cur;
  $("#lab").textContent=`Big ${x.c}, small ${lo(x)}`;
  $("#lt").innerHTML=`<b id="bigL">${x.c}</b><b id="smallL">${lo(x)}</b>`;
  $("#pics").innerHTML=x.w.map((w,k)=>`<div class="pic" data-k="${k}"><img src="images/${w[1]}.png" alt="${w[0]}"><div class="cap"><i>${x.c}${lo(x)}</i> ${w[0]}</div></div>`).join("");
  $("#card").classList.add("on");
  const hi=(sel,on)=>{$$(sel).forEach(e=>e.classList.toggle("hi",on))};
  const ok=()=>my===token;
  hi("#bigL",true);await say(`Big ${x.n}.`);hi("#bigL",false);if(!ok())return;
  hi("#smallL",true);await say(`Small ${x.n}.`);hi("#smallL",false);if(!ok())return;
  await say(`What is the sound of ${x.n}?`,300);if(!ok())return;
  if(!hasT(x.c)){hi("#bigL,#smallL",true);await track(x.c);hi("#bigL,#smallL",false);return}
  await block(x.c,(k,on)=>{
    if(k==="w1")hi('.pic[data-k="0"]',on);
    else if(k==="w2")hi('.pic[data-k="1"]',on);
    else hi("#bigL,#smallL",on);
  });
}
$("#again").onclick=()=>lesson(L.indexOf(cur));
$("#snd").onclick=async()=>{stop();const my=token;$$("#bigL,#smallL").forEach(e=>e.classList.add("hi"));if(hasT(cur.c))await clip(cur.c,"snd");else await track(cur.c);$$("#bigL,#smallL").forEach(e=>e.classList.remove("hi"))};
$("#stopb").onclick=()=>{stop();$$("#bigL,#smallL").forEach(e=>e.classList.remove("hi"))};
$("#close").onclick=()=>{stop();$("#card").classList.remove("on")};
document.addEventListener("click",e=>{const p=e.target.closest(".pic");if(p&&cur){stop();const k=+p.dataset.k+1;if(hasT(cur.c))clip(cur.c,"w"+k);else say(cur.w[k-1][0],0)}});

/* ---------- fish game ---------- */
function fishSVG(x,col){
  return `<svg viewBox="0 0 200 110"><path d="M150 55 L196 18 Q184 55 196 92Z" fill="${col}" opacity=".85"/><ellipse cx="85" cy="55" rx="72" ry="46" fill="${col}"/><path d="M50 14 Q85 -8 120 14Z" fill="${col}" opacity=".8"/><ellipse cx="85" cy="68" rx="55" ry="24" fill="#fff" opacity=".28"/><circle cx="35" cy="45" r="12" fill="#fff"/><circle cx="32" cy="45" r="6" fill="#111"/><path d="M14 66 Q24 74 34 68" stroke="#4a2c14" stroke-width="3" fill="none" stroke-linecap="round"/><text x="92" y="76" class="fl" text-anchor="middle">${x.c}${lo(x)}</text></svg>`;
}
L.forEach((x,i)=>{
  const d=document.createElement("div");d.className="f";
  d.style.top=(4+i*9.5)+"%";d.style.animationDuration=(16+(i*3)%11)+"s";d.style.animationDelay=(-i*2.7)+"s";
  d.style.width=(130+(i%3)*30)+"px";d.innerHTML=fishSVG(x,COL[i]);
  d.onclick=()=>fishTap(i,d);$("#sea").appendChild(d);
});
async function fishTap(i,d){
  if(target!==null){
    if(i===target){
      const t=target;target=null;stop();
      $("#fsay").className="say";$("#fsay").textContent=`Yes! Big ${L[t].c}, small ${lo(L[t])}!`;
      await say(`Big ${L[t].n}, small ${L[t].n}.`);
      await reward("You found it! A bear for you!");
      nextFind();
    }else{stop();say("Try again!");$("#fsay").textContent="Try again!"}
    return;
  }
  d.classList.add("pop");setTimeout(()=>d.classList.remove("pop"),1500);
  lesson(i);
}
function ask(){
  const x=L[target];stop();
  $("#fsay").className="say q";$("#fsay").textContent=`Find Big ${x.c}, small ${lo(x)} 🔊`;
  say(`Find the Big ${x.n}, small ${x.n}.`);
}
function nextFind(){
  let t;do{t=Math.floor(Math.random()*L.length)}while(t===target&&L.length>1);
  target=t;ask();
}
$("#find").onclick=()=>{$("#card").classList.remove("on");nextFind()};
$("#fsay").onclick=()=>{if(target!==null)ask()};

/* ---------- grids ---------- */
$("#wgrid").innerHTML=L.map((x,i)=>`<button class="lb" data-i="${i}">${x.c}${lo(x)}</button>`).join("");
$("#wgrid").onclick=e=>{const b=e.target.closest(".lb");if(b)lesson(+b.dataset.i)};
$("#sgrid").innerHTML=L.map(x=>`<button class="lb" data-c="${x.c}">${x.c}${lo(x)}</button>`).join("");
$("#sgrid").onclick=e=>{const b=e.target.closest(".lb");if(!b)return;
  $$("#sgrid .lb").forEach(k=>k.classList.toggle("sel",k===b));
  $("#vwrap").style.display="block";const v=$("#vid");v.src=`${b.dataset.c}.mp4`;v.play().catch(()=>{});v.scrollIntoView({behavior:"smooth"})};

/* ---------- tracing: Big and small together ---------- */
let tc=0;
const cv=$("#cv"),cx=cv.getContext("2d");
$("#tgrid").innerHTML=L.map((x,i)=>`<button class="lb" style="font-size:34px;padding:6px" data-i="${i}">${x.c}</button>`).join("");
function guide(){
  const x=L[tc];
  cx.clearRect(0,0,cv.width,cv.height);
  cx.lineWidth=2;cx.strokeStyle="#e5e0d4";
  [95,215,335].forEach((y,k)=>{cx.setLineDash(k==1?[8,8]:[]);cx.beginPath();cx.moveTo(10,y);cx.lineTo(850,y);cx.stroke()});
  cx.setLineDash([]);
  cx.fillStyle="#b9ad92";cx.font='bold 26px "Comic Sans MS",sans-serif';cx.textAlign="center";
  cx.fillText(`Big ${x.c}`,235,40);cx.fillText(`small ${lo(x)}`,625,40);
  cx.font='260px "Comic Sans MS","Chalkboard SE",sans-serif';
  cx.lineWidth=3;cx.strokeStyle="#c9c2b2";cx.fillStyle="#f3efe4";
  cx.setLineDash([10,9]);
  cx.fillText(x.c,235,335);cx.strokeText(x.c,235,335);
  cx.fillText(lo(x),625,335);cx.strokeText(lo(x),625,335);
  cx.setLineDash([]);
  $("#ttip").textContent=`Trace Big ${x.c} and small ${lo(x)}`;
  $$("#tgrid .lb").forEach((b,i)=>b.classList.toggle("sel",i===tc));
}
$("#tgrid").onclick=e=>{const b=e.target.closest(".lb");if(b){tc=+b.dataset.i;guide()}};
$("#tclear").onclick=guide;
$("#tsay").onclick=async()=>{stop();const my=token,x=L[tc];await say(`Big ${x.n}. Small ${x.n}.`);};
$("#tdone").onclick=async()=>{stop();await reward("Lovely tracing! A bear for you!");guide()};
let down=false;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.strokeStyle="#e8281e";cx.lineWidth=14;cx.lineCap="round";cx.lineJoin="round";cx.setLineDash([]);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke()};
cv.onpointermove=e=>{if(!down)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke();cx.beginPath();cx.moveTo(x,y)};
cv.onpointerup=()=>{down=false};
/* ---------- match games ---------- */
const EM={apple:"🍎",annie:"👧🏼",boy:"👦",bat:"🏏",cat:"🐱",car:"🚗",dog:"🐶",duck:"🦆",egg:"🥚",elephant:"🐘",fish:"🐟",farm:"🚜",girl:"👧🏽",guitar:"🎸",hat:"👒",horse:"🐴",insect:"🐛",ill:"🤒"};
const IT=L.flatMap((x,i)=>x.w.map((w,k)=>({i,k,word:w[0],key:w[1],e:EM[w[1]]})));
let mm=1,cur1=null;
const shuf=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function sfx(ok){try{ac=ac||new AC();const t=ac.currentTime;(ok?[660,880,1175]:[220,160]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.18,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.2);o.connect(g);g.connect(ac.destination);o.start(t+i*.12);o.stop(t+i*.12+.22)})}catch(e){}}
const playSnd=i=>hasT(L[i].c)?clip(L[i].c,"snd",150):say(L[i].n,0);
const itOf=k=>IT.find(x=>x.key===k);
const sayWord=it=>hasT(L[it.i].c)?clip(L[it.i].c,"w"+(it.k+1),200):say(it.word);
$$("[data-m]").forEach(b=>b.onclick=()=>{mm=+b.dataset.m;round(mm)});
async function round(m){
  stop();const my=token,g=$("#mg");
  if(m===1){
    const it=rnd(IT);cur1=it;
    const others=shuf(L.map((_,i)=>i).filter(i=>i!==it.i)).slice(0,2);
    g.innerHTML=`<div class="be">${it.e}</div><div class="q">What letter does it start with?</div><div class="opts">${shuf([it.i,...others]).map(o=>`<button class="opt" data-o="${o}">${L[o].c}${lo(L[o])}</button>`).join("")}</div><div class="rev" id="rev"></div>`;
    $("#msay").textContent="Listen and choose the first letter";
    await sayWord(it);if(my!==token)return;say("What is the first letter?");
    g.onclick=async e=>{const b=e.target.closest(".opt");if(!b||!cur1)return;
      if(+b.dataset.o===it.i){cur1=null;stop();const t=token;
        $("#rev").innerHTML=`<img src="images/${it.key}.png" alt="${it.word}">`;
        sfx(true);await playSnd(it.i);await sayWord(it);await reward("Yes! A bear for you!");round(1)}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);stop();sfx(false);await playSnd(+b.dataset.o);say("Try again!")}};
  }else if(m===2){
    const it=rnd(IT);let ch=[it];
    shuf(IT.filter(x=>x.i!==it.i)).forEach(x=>{if(ch.length<3&&!ch.some(c=>c.i===x.i))ch.push(x)});
    g.innerHTML=`<button class="btn" id="lis">🔊 Listen</button><div class="q">Tap the picture you hear!</div><div class="opts">${shuf(ch).map(c=>`<button class="opt" data-w="${c.key}">${c.e}</button>`).join("")}</div>`;
    $("#msay").textContent="Listen and find the picture";
    $("#lis").onclick=()=>{stop();sayWord(it)};
    await sayWord(it);
    g.onclick=async e=>{const b=e.target.closest(".opt");if(!b)return;
      if(b.dataset.w===it.key){stop();sfx(true);await sayWord(it);await reward("Yes! A bear for you!");round(2)}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);stop();sfx(false);await sayWord(itOf(b.dataset.w));say("Try again!")}};
  }else{
    let pk=[];shuf(IT).forEach(x=>{if(pk.length<3&&!pk.some(c=>c.i===x.i))pk.push(x)});
    g.innerHTML=`<div class="q">Match the letter to the picture!</div><div class="cols"><div>${shuf(pk).map(c=>`<button class="opt" data-l="${c.key}">${L[c.i].c}${lo(L[c.i])}</button>`).join("")}</div><div>${shuf(pk).map(c=>`<button class="opt" data-p="${c.key}">${c.e}</button>`).join("")}</div></div>`;
    $("#msay").textContent="Tap a letter, then its picture";
    let sel=null,left=3;
    g.onclick=async e=>{const b=e.target.closest(".opt");if(!b)return;
      if(b.dataset.l){$$("#mg [data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;stop();playSnd(itOf(b.dataset.l).i);return}
      if(!sel){say("Tap a letter first.");return}
      if(sel.dataset.l===b.dataset.p){const it=IT.find(x=>x.key===b.dataset.p);sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;left--;stop();sfx(true);
        await playSnd(it.i);await sayWord(it);if(!left){await reward("You matched them all! A bear for you!");round(3)}}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);stop();sfx(false);await sayWord(itOf(b.dataset.p));say("Try again!")}};
  }
}
guide();showBears();
</script>
</body>
</html>
